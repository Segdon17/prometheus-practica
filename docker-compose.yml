version: '3.8'

services:
  # a) Aplicación Web (FastAPI)
  web-app:
    build: .
    container_name: app-Gordillo
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    depends_on:
      - prometheus
    networks:
      - monitoring

  # b) cAdvisor (Métricas de contenedores)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor-Gordillo
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 500M # Límite recomendado para evitar fugas de memoria
    networks:
      - monitoring

  # c) Prometheus (Recolector de métricas)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-Gordillo
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - monitoring

  # d) Grafana (Visualización)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-Gordillo
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Contraseña por defecto
    volumes:
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
    