global:
  scrape_interval: 15s # Frecuencia de recolección

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Trabajo para tu aplicación FastAPI
  - job_name: 'fastapi-app'
    static_configs:
      - targets: ['web-app:8000'] # 'web-app' es el nombre del servicio en docker-compose

  # Trabajo para cAdvisor (métricas de contenedores)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
      